<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ΟΜΜΑ - Πύλη Διαχείρισης Βαρδιών</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans text-zinc-900">
  <div class="max-w-md w-full bg-white shadow-2xl overflow-hidden border border-zinc-200">
    <div class="bg-black px-6 py-12 text-center flex flex-col items-center">
      <!-- CSS representation of the Megaron Logo -->
      <div class="flex items-end space-x-1 h-12 mb-8">
        <div class="w-2.5 bg-white h-4"></div>
        <div class="w-2.5 bg-white h-6"></div>
        <div class="w-2.5 bg-white h-8"></div>
        <div class="w-2.5 bg-white h-12"></div>
        <div class="w-2.5 bg-white h-8"></div>
        <div class="w-2.5 bg-white h-6"></div>
      </div>
      <h2 class="text-xl font-medium text-white tracking-[0.25em] uppercase leading-relaxed">Μεγαρο<br/>Μουσικης<br/>Αθηνων</h2>
      <div class="w-12 h-[1px] bg-zinc-700 my-6"></div>
      <p class="text-zinc-400 text-xs tracking-widest uppercase">Διαχειριση Βαρδιων & Προσωπικου</p>
    </div>
    
    <div class="p-8">
      <form onsubmit="handleLogin(event)" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Ηλεκτρονικη Διευθυνση</label>
          <input id="email" type="email" placeholder="email@example.com (ή manager/supervisor@megaron.gr)" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 font-medium placeholder-zinc-400" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Κωδικος Προσβασης</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 placeholder-zinc-400" required />
        </div>
        <button type="submit" class="w-full bg-black text-white font-medium py-4 tracking-[0.2em] uppercase text-sm hover:bg-zinc-800 transition mt-2">
          Εισοδος στο Συστημα
        </button>
      </form>
    </div>
  </div>
  <script>
    lucide.createIcons();
    
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      
      if (email === 'manager@megaron.gr') {
        window.location.href = 'manager.html';
      } else if (email === 'supervisor@megaron.gr') {
        window.location.href = 'supervisor.html';
      } else {
        window.location.href = 'usher.html';
      }
    }
  </script>
</body>
</html>
