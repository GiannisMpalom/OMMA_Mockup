<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ΟΜΜΑ - Πύλη Διαχείρισης Βαρδιών</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-zinc-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans text-zinc-900">
  <div class="max-w-md w-full bg-white shadow-2xl overflow-hidden border border-zinc-200">
    <div class="bg-black px-6 py-12 text-center flex flex-col items-center">
      <!-- CSS representation of the Megaron Logo -->
      <div class="flex items-end space-x-1 h-12 mb-8">
        <div class="w-2.5 bg-white h-4"></div>
        <div class="w-2.5 bg-white h-6"></div>
        <div class="w-2.5 bg-white h-8"></div>
        <div class="w-2.5 bg-white h-12"></div>
        <div class="w-2.5 bg-white h-8"></div>
        <div class="w-2.5 bg-white h-6"></div>
      </div>
      <h2 class="text-xl font-medium text-white tracking-[0.25em] uppercase leading-relaxed">Μεγαρο<br/>Μουσικης<br/>Αθηνων</h2>
      <div class="w-12 h-[1px] bg-zinc-700 my-6"></div>
      <p class="text-zinc-400 text-xs tracking-widest uppercase">Διαχειριση Βαρδιων & Προσωπικου</p>
    </div>
    
    <div class="p-8" id="loginContainer">
      <form onsubmit="handleLogin(event)" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Ηλεκτρονικη Διευθυνση</label>
          <input id="email" type="email" placeholder="email@example.com (ή manager/supervisor@megaron.gr)" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 font-medium placeholder-zinc-400" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Κωδικος Προσβασης</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 placeholder-zinc-400" required />
        </div>
        <button type="submit" class="w-full bg-black text-white font-medium py-4 tracking-[0.2em] uppercase text-sm hover:bg-zinc-800 transition mt-2">
          Εισοδος στο Συστημα
        </button>
        <div class="text-center mt-4 pt-2">
             <button type="button" onclick="showRegisterStep1()" class="text-[10px] text-zinc-500 hover:text-black uppercase tracking-widest font-semibold transition">Δημιουργια Νεου Λογαριασμου</button>
        </div>
      </form>
    </div>

    <div class="p-8 hidden" id="registerStep1Container">
      <form onsubmit="handleRegisterStep1(event)" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Email Εγγραφης</label>
          <input id="regEmail" type="email" placeholder="email@example.com" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 font-medium placeholder-zinc-400" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-2">Νεος Κωδικος</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 placeholder-zinc-400" required />
        </div>
        <button type="submit" class="w-full bg-black text-white font-medium py-4 tracking-[0.2em] uppercase text-sm hover:bg-zinc-800 transition mt-2">
          Επομενο
        </button>
        <div class="text-center mt-4 pt-2">
             <button type="button" onclick="showLogin()" class="text-[10px] text-zinc-500 hover:text-black uppercase tracking-widest font-semibold transition">Επιστροφη στην Εισοδο</button>
        </div>
      </form>
    </div>

    <div class="p-8 hidden" id="registerStep2Container">
       <form onsubmit="handleRegisterSubmit(event)" class="space-y-6">
          <p class="text-xs font-semibold text-zinc-500 uppercase tracking-widest mb-4 border-b border-zinc-200 pb-2">Ερωτηματολογιο Προφιλ</p>
          <div>
            <label class="block text-[10px] font-semibold text-zinc-500 uppercase tracking-widest mb-2">Πως σε λενε;</label>
            <input type="text" placeholder="Ονοματεπώνυμο" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 font-medium placeholder-zinc-400 text-sm" required />
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-zinc-500 uppercase tracking-widest mb-2">Ποσο καιρο εισαι στο Μεγαρο;</label>
            <input type="text" placeholder="π.χ. 6 μήνες, 2 χρόνια" class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 font-medium placeholder-zinc-400 text-sm" required />
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-zinc-500 uppercase tracking-widest mb-2">Προτιμαω να δουλευω:</label>
            <select class="w-full px-4 py-3 border border-zinc-300 rounded-none focus:ring-1 focus:ring-black focus:border-black outline-none transition bg-zinc-50 font-medium text-zinc-700 text-sm" required>
               <option value="" disabled selected>Επιλέξτε...</option>
               <option value="morning">Πρωί</option>
               <option value="afternoon">Μεσημέρι</option>
               <option value="evening">Βράδυ</option>
               <option value="any">Δεν με νοιάζει</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-black text-white font-medium py-4 tracking-[0.2em] uppercase text-sm hover:bg-zinc-800 transition mt-2">
            Ολοκληρωση Εγγραφης
          </button>
          <div class="text-center mt-4 pt-2">
             <button type="button" onclick="showRegisterStep1()" class="text-[10px] text-zinc-500 hover:text-black uppercase tracking-widest font-semibold transition">Πισω</button>
          </div>
       </form>
    </div>
  </div>

  <div class="mt-8 text-center text-[10px] text-zinc-500 max-w-sm border border-zinc-200 bg-white p-4 rounded shadow-sm">
    <p class="font-bold mb-2 uppercase tracking-widest text-zinc-800 border-b border-zinc-100 pb-2">MOCKUP ΟΔΗΓΙΕΣ ΕΙΣΟΔΟΥ</p>
    <p class="mb-3 leading-relaxed">Χρησιμοποιήστε τα παρακάτω emails για να εισέλθετε στα αντίστοιχα panels. Οποιοδήποτε άλλο email θα ανοίξει το περιβάλλον του Ταξιθέτη.</p>
    <div class="space-y-1 font-mono text-[11px] bg-zinc-50 p-2 rounded text-zinc-600">
      <p>manager@megaron.gr</p>
      <p>supervisor@megaron.gr</p>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    function showRegisterStep1() {
        document.getElementById('loginContainer').classList.add('hidden');
        document.getElementById('registerStep2Container').classList.add('hidden');
        document.getElementById('registerStep1Container').classList.remove('hidden');
    }

    function showLogin() {
        document.getElementById('registerStep1Container').classList.add('hidden');
        document.getElementById('registerStep2Container').classList.add('hidden');
        document.getElementById('loginContainer').classList.remove('hidden');
    }

    function handleRegisterStep1(event) {
        event.preventDefault();
        document.getElementById('registerStep1Container').classList.add('hidden');
        document.getElementById('registerStep2Container').classList.remove('hidden');
    }

    function handleRegisterSubmit(event) {
        event.preventDefault();
        alert('Η εγγραφή ολοκληρώθηκε (Mock).');
        window.location.href = 'usher.html';
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      
      if (email === 'manager@megaron.gr') {
        window.location.href = 'manager.html';
      } else if (email === 'supervisor@megaron.gr') {
        window.location.href = 'supervisor.html';
      } else {
        window.location.href = 'usher.html';
      }
    }
  </script>
</body>
</html>
